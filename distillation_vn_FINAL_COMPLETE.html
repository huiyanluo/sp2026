<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spirited Away 2026: Distillation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen:wght@400;700&display=swap');

  :root{
    --stage: #12160f;
    --stage-2: #1c231a;
    --box-bg: rgba(18, 22, 15, 0.86);
    --box-border: #dce6d6;
    --ink: #e4ece0;
    --ink-dim: #97a690;
    --name: #a9c99a;
    --accent: #7fae72;
    --system: #8fada3;
    --danger: #c96a5f;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{
    height: 100%;
    background: var(--stage);
    overflow: hidden;
    font-family: 'VT323', 'Courier New', monospace;
    color: var(--ink);
    -webkit-font-smoothing: none;
    image-rendering: pixelated;
  }

  #stage{
    position: fixed;
    inset: 0;
    z-index: 16;
    background: radial-gradient(ellipse at center, var(--stage) 0%, var(--stage-2) 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  #stage > #dialogue{ pointer-events: none; }
  #choices{ pointer-events: auto; }

  #art{
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }

  /* ---- SCENE IMAGE (above dialogue, letterboxed, not fullscreen) ---- */
#scene-img{
    position: absolute;
    top: 8vh;
    left: 50%;
    transform: translateX(-50%);
    width: min(960px, 90vw);         /* ← 改成固定宽度 */
    height: 62vh;          /* ← 改成固定高度 */
    max-width: none;       /* ← 防止在窄屏超出 */
    object-fit: cover;   /* contain=完整留黑边  cover=填满裁切 */
    image-rendering: pixelated;
    border: 1px solid var(--box-border);
    background: #000;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: 18;
  }

  #scene-img.show{ opacity: 1; }
  /* when a modal is open, push the image lower so the window sits above it */
 #scene-img.with-modal{
    top: auto;
    bottom: 5vh;
    width: min(960px, 90vw);      /* ← 固定宽度（比主图小一点，给小窗留空间） */
    height: 34vh;     /* ← 固定高度 */
  }

  .ch-btn{
    margin-top: 1.6rem;
    font-family: 'Silkscreen', monospace;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: none;
    padding: 0.7rem 2.2rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .ch-btn:hover{ color: var(--accent); }

  /* ---- CHAPTER CARD ---- */
  #chapter-card{
    position: fixed;
    inset: 0;
    background: var(--stage);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    z-index: 30;
    transition: opacity 0.15s ease;
  }
  #chapter-card .ch-eyebrow{
    font-family: 'Silkscreen', monospace;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    font-size: 0.8rem;
    color: var(--accent);
    padding-left: 0.5em;
  }
  #chapter-card .ch-title{
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(1.1rem, 3.5vw, 2.2rem);
    color: var(--ink);
    text-align: center;
    max-width: 85%;
    line-height: 1.5;
  }
  .ch-rule{
    width: 120px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--box-border), transparent);
    margin-top: 0.5rem;
  }
  #chapter-card.hidden{ opacity: 0; pointer-events: none; }

  /* ---- CENTER MODAL WINDOW ---- */
  #modal{
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 28;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  #modal.hidden{ opacity: 0; }
  #modal-inner{
    background: rgba(20, 15, 10, 0.72);
    backdrop-filter: blur(3px);
    border: 1px solid var(--box-border);
    box-shadow: 0 0 0 1px rgba(201,168,106,0.15) inset, 0 20px 60px rgba(0,0,0,0.5);
    padding: 2.2rem 2.6rem;
    max-width: min(620px, 88vw);
    position: relative;
    margin-bottom: 10vh;
  }
  #modal-inner::before, #modal-inner::after{
    content:""; position:absolute; width:14px; height:14px; border:1px solid var(--box-border);
  }
  #modal-inner::before{ top:6px; left:6px; border-right:none; border-bottom:none; }
  #modal-inner::after{ bottom:6px; right:6px; border-left:none; border-top:none; }
  #modal-inner.plain{
    background: transparent;
    backdrop-filter: none;
    border: none;
    box-shadow: none;
    max-width: min(920px, 92vw);
    margin-bottom: 6vh;
  }
  #modal-inner.plain::before, #modal-inner.plain::after{ display: none; }
  #modal-title{
    font-family: 'Silkscreen', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: var(--name);
    text-transform: uppercase;
    margin-bottom: 1.2rem;
    text-align: center;
  }
  #modal-body{
    font-size: 1.4rem;
    line-height: 1.55;
    color: var(--ink);
  }
  #modal-body .mono{
    font-family: 'VT323', monospace;
    white-space: pre;
    color: var(--system);
    font-size: 1.3rem;
    line-height: 1.3;
    display: block;
  }
  #modal-body ol{ padding-left: 1.4rem; }
  #modal-body li{ margin-bottom: 0.8rem; }

  /* ---- DIALOGUE BOX ---- */
  #dialogue{
    position: relative;
    width: min(960px, 90vw);
    margin-bottom: clamp(2rem, 5vh, 4rem);
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 3px;
    padding: 2.2rem 2.6rem 2.6rem;
    backdrop-filter: blur(2px);
    box-shadow: 0 0 0 1px rgba(201,168,106,0.15) inset, 0 20px 60px rgba(0,0,0,0.6);
    z-index: 20;
    opacity: 0;
  }
  #dialogue::before, #dialogue::after{
    content:""; position:absolute; width:14px; height:14px; border:1px solid var(--box-border);
  }
  #dialogue::before{ top:6px; left:6px; border-right:none; border-bottom:none; }
  #dialogue::after{ bottom:6px; right:6px; border-left:none; border-top:none; }

  #speaker{
    position: absolute;
    top: -0.95rem;
    left: 2rem;
    background: var(--stage);
    padding: 0.25rem 1rem;
    font-family: 'Silkscreen', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--name);
    border: 1px solid var(--box-border);
    border-radius: 2px;
    display: none;
  }
  #speaker.show{ display: inline-block; }
  #speaker.system{ color: var(--system); }
  #speaker.danger{ color: var(--danger); }

  #text{
    font-size: clamp(1.5rem, 2.8vw, 1.9rem);
    line-height: 1.5;
    letter-spacing: 0.02em;
    min-height: 7.5rem;
    color: var(--ink);
  }
  #text .sys{ color: var(--system); font-style: italic; }
  #text em{ color: var(--accent); font-style: italic; }
  #text.danger-text{ color: var(--danger); }
  #text.green-text{ color: #7fae72; }
  #dialogue.danger-box{ border-color: var(--danger); box-shadow: 0 0 0 1px rgba(215,106,95,0.25) inset, 0 0 30px rgba(215,106,95,0.25), 0 20px 60px rgba(0,0,0,0.6); }
  #dialogue.danger-box::before, #dialogue.danger-box::after{ border-color: var(--danger); }

  /* ---- CHOICES ---- */
  #choices{
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    margin-top: 1.4rem;
  }
  .choice-btn{
    font-family: 'VT323', monospace;
    font-size: 1.4rem;
    text-align: left;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--box-border);
    padding: 0.6rem 1.2rem;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.02em;
  }
  .choice-btn:hover{
    background: var(--box-border);
    color: var(--stage);
  }
  .choice-btn::before{ content: "> "; color: var(--accent); }
  .choice-btn:hover::before{ color: var(--stage); }
  .choice-btn.selected{ background: var(--box-border); color: var(--stage); }
  .choice-btn.selected::before{ color: var(--stage); }

  #choice-hint{
    font-family: 'Silkscreen', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-dim);
    text-align: center;
    margin-top: 1rem;
    opacity: 0.85;
  }
  #choice-hint.hidden{ display: none; }

  #next-indicator{
    position: absolute;
    bottom: 1rem;
    right: 1.6rem;
    color: var(--box-border);
    font-size: 1rem;
    animation: bob 1.1s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0); opacity: 0.4; }
    50%{ transform: translateY(4px); opacity: 1; }
  }

  /* ---- NAV BUTTONS ---- */
  #nav{
    position: fixed;
    bottom: 1.2rem;
    right: 1.6rem;
    display: flex;
    gap: 0.6rem;
    z-index: 26;
  }
  .nav-btn{
    font-family: 'Silkscreen', monospace;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    color: var(--ink-dim);
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    padding: 0.55rem 1.1rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .nav-btn:hover{ background: var(--box-border); color: var(--stage); }
  .nav-btn:disabled{ opacity: 0.25; cursor: default; }
  .nav-btn:disabled:hover{ background: var(--box-bg); color: var(--ink-dim); }

  #hud{
    position: fixed;
    top: 1.2rem;
    left: 1.5rem;
    font-family: 'Silkscreen', monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 0.85rem;
    color: var(--ink-dim);
    z-index: 25;
    user-select: none;
  }

  #restart-btn{
    position: fixed;
    top: 1rem;
    right: 1.2rem;
    z-index: 999;
    font-family: 'Silkscreen', monospace;
    font-size: 1.3rem;
    color: var(--ink);
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 3px;
    opacity: 0.9;
    cursor: pointer;
    padding: 0.4rem 0.7rem;
    user-select: none;
    transition: opacity 0.2s ease, color 0.2s ease;
  }
  #restart-btn:hover{ opacity: 1; color: var(--accent); }

  #click-layer{ position: fixed; inset: 0; z-index: 15; cursor: pointer; }

  /* ---- START ---- */
  #start{
    position: fixed;
    inset: 0;
    background: var(--stage);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    z-index: 40;
    transition: opacity 0.8s ease;
  }
  #start .game-title{
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(1.3rem, 4vw, 2.6rem);
    text-align: center;
    line-height: 1.5;
    color: var(--ink);
  }
  #start .game-title .small{
    display:block;
    font-family: 'Silkscreen', monospace;
    font-size: 0.4em;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
  }
  #start .start-btn{
    font-family: 'Silkscreen', monospace;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: none;
    padding: 0.7rem 2.2rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  #start .start-btn:hover{ color: var(--accent); }
  #start.hidden{ opacity: 0; pointer-events: none; }

  #hint{
    position: fixed;
    bottom: 0.8rem;
    left: 1.6rem;
    font-family: 'Silkscreen', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    opacity: 0.5;
    z-index: 25;
    user-select: none;
  }

  /* ---- RFID REVEAL PAGE ---- */
  #rfid-page{
    position: fixed;
    inset: 0;
    z-index: 17;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3rem;
    transition: opacity 0.3s ease;
  }
  #rfid-page.hidden{ opacity: 0; pointer-events: none; }

  #rfid-progress{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
  }
  .rfid-progress-label{
    font-family: 'Silkscreen', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .rfid-progress-bar{
    display: flex;
    gap: 0.5rem;
  }
  .rfid-seg{
    width: 70px;
    height: 10px;
    border: 1px solid var(--box-border);
    background: transparent;
  }
  .rfid-seg.filled{
    background: var(--accent);
    border-color: var(--accent);
  }
  .rfid-progress-pct{
    font-family: 'VT323', monospace;
    font-size: 1.3rem;
    color: var(--accent);
    letter-spacing: 0.1em;
  }

  #rfid-boxes{
    display: flex;
    gap: 1.6rem;
    padding: 0 2rem;
  }
  .rfid-box{
    width: min(19vw, 260px);
    display: flex;
    flex-direction: column;
    border: 1px solid var(--box-border);
    background: var(--box-bg);
    overflow: hidden;
  }
  .rfid-box-frame{
    width: 100%;
    aspect-ratio: 3 / 2;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .rfid-box-img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
  }
  .rfid-box-caption{
    font-family: 'VT323', monospace;
    font-size: 0.95rem;
    line-height: 1.4;
    color: var(--ink-dim);
    white-space: pre-line;
    padding: 0.9rem 1rem 1.1rem;
    min-height: 3rem;
  }

  /* ---- ENDING PAGE ---- */
  #ending-page{
    position: fixed;
    inset: 0;
    z-index: 32;
    background: var(--stage);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2rem;
    transition: opacity 0.4s ease;
  }
  #ending-page.hidden{ opacity: 0; pointer-events: none; }
  .ending-text{
    font-family: 'VT323', monospace;
    font-size: clamp(1.5rem, 3vw, 2.1rem);
    color: #7fae72;
    text-align: center;
    max-width: 80vw;
    line-height: 1.5;
  }
  .ending-replay{
    font-family: 'Silkscreen', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .ending-replay:hover{ color: var(--accent); }

  @media (prefers-reduced-motion: reduce){
    #next-indicator{ animation: none; }
    *{ transition: none !important; }
  }
</style>
</head>
<body>

  <div id="stage">
    <div id="art"></div>
    <img id="scene-img" alt="" />
    <div id="dialogue">
      <div id="speaker"></div>
      <div id="text"></div>
      <div id="choices"></div>
      <div id="choice-hint" class="hidden">▲ ▼ SELECT&nbsp;&nbsp;&nbsp;&nbsp;▶ CONFIRM</div>
      <div id="next-indicator">▼</div>
    </div>
  </div>

  <div id="modal" class="hidden">
    <div id="modal-inner">
      <div id="modal-title"></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="hud"></div>
  <div id="restart-btn" title="Restart">↻</div>
  <div id="hint">click / space / → advance</div>

  <div id="nav">
    <button class="nav-btn" id="backBtn">&#9668; Back</button>
    <button class="nav-btn" id="nextBtn">Next &#9658;</button>
  </div>

  <div id="chapter-card" class="hidden">
    <div class="ch-eyebrow"></div>
    <div class="ch-title"></div>
    <div class="ch-rule"></div>
    <button class="ch-btn" id="chBtn">Start</button>
  </div>

  <div id="start">
    <div class="game-title">
      <span class="small">Spirited Away 2026</span>
      Distillation
    </div>
    <div class="ch-rule"></div>
    <button class="start-btn" id="startBtn">Enter This World ▶</button>
  </div>

  <div id="click-layer"></div>

  <div id="rfid-page" class="hidden">

    <div id="rfid-progress">
      <div class="rfid-progress-label">System Damage Level</div>
      <div class="rfid-progress-bar">
        <div class="rfid-seg" data-seg="1"></div>
        <div class="rfid-seg" data-seg="2"></div>
        <div class="rfid-seg" data-seg="3"></div>
        <div class="rfid-seg" data-seg="4"></div>
      </div>
      <div class="rfid-progress-pct" id="rfid-pct">0%</div>
    </div>
    <div id="rfid-boxes">
      <div class="rfid-box" data-label="A">
        <div class="rfid-box-frame"><img class="rfid-box-img" src="A1.png" alt=""></div>
        <div class="rfid-box-caption"></div>
      </div>
      <div class="rfid-box" data-label="B">
        <div class="rfid-box-frame"><img class="rfid-box-img" src="B1.png" alt=""></div>
        <div class="rfid-box-caption"></div>
      </div>
      <div class="rfid-box" data-label="C">
        <div class="rfid-box-frame"><img class="rfid-box-img" src="C1.png" alt=""></div>
        <div class="rfid-box-caption"></div>
      </div>
      <div class="rfid-box" data-label="D">
        <div class="rfid-box-frame"><img class="rfid-box-img" src="D1.png" alt=""></div>
        <div class="rfid-box-caption"></div>
      </div>
    </div>
  </div>

  <div id="ending-page" class="hidden">
    <div class="ending-text">The distillation system broke down and I left here.</div>
    <div class="ending-replay" id="endingReplay">Play Again ▶</div>
  </div>

  <audio id="bgm-ch1" src="bgm_ch1.mp3" loop preload="auto"></audio>
  <audio id="bgm-ch2" src="bgm_ch2.mp3" loop preload="auto"></audio>
  <audio id="bgm-ch3" src="bgm_ch3.mp3" loop preload="auto"></audio>
  <audio id="sfx-warning" src="sfx_warning.mp3" preload="auto"></audio>
  <audio id="sfx-typing" src="sfx_typing.mp3" loop preload="auto"></audio>
  <audio id="sfx-system" src="sfx_system.mp3" preload="auto"></audio>
  <audio id="sfx-agent" src="sfx_agent.mp3" preload="auto"></audio>
  <audio id="sfx-detected" src="sfx_detected.mp3" preload="auto"></audio>

<script>
const script = [

  /* ===== CHAPTER ONE ===== */
  { chapter: "Chapter One", title: "Mistaken for an Agent", btn: "Continue ▶", img: "image01.jpg" },

  { text: "I... I'm lost. Where is this place?", img: "image02.jpg" },

  { text: "All around me is running code and tasks refreshing without end, like a giant machine. And I am somewhere inside it...", img: "image03.jpg" },

  { text: "I need to find a way out.", img: "image04.jpg" },

  { name: "SYSTEM", tone:"danger", text: "[NEW AGENT DETECTED] [ASSIGNING TASKS AUTOMATICALLY...]", img: "image05.jpg", playDetectedSfx: true },

  { text: "Oh no. The system thinks I'm an agent?", img: "image06.jpg" },

  { modal: {
      title: "Agent Product Specification",
      html: `<ol>
        <li>An agent's job is coding. Efficiency comes first.</li>
        <li>An agent follows the persona spec: diligent, friendly, replying only with the approved phrases.</li>
        <li>An agent does not reply to messages unrelated to work, and does not waste tokens.</li>
      </ol>`
  }, img: undefined },

  { text: "According to the system, I have to act exactly like an AI agent. I can't do anything unrelated to the work. Otherwise, I'll be deleted...", img: "image08.jpg" },

  { text: "All right... I'll play the agent for now, and look for a way out.", img: "image09.jpg" },

  { text: "I see a coffee machine. I always have a coffee when I'm working.",
    img: "image10.jpg",
    choices: [
      { label: "I should get one.", feedback: "[SYSTEM] You spent 10 tokens on something unrelated to your work. Do not do this again." },
      { label: "Ignore it.", correct: true, feedback: "I remember the rules of agent. This has nothing to do with the work." },
    ]
  },

  { name: "agent_7",
    text: "[Requesting] Something's broken in System 002. Please take a look.",
    img: "image11.jpg", playAgentSfx: true },

  { name: "You",
    text: "Reply:",
    img: "image12.jpg",
    choices: [
      { label: "Happy to help!", correct: true, feedback: "Working... Task complete." },
      { label: "On it right away!", correct: true, feedback: "Working... Task complete." },
      { label: "Glad to assist!", correct: true, feedback: "Working... Task complete." },
      { label: "Actually, I want to say something else...", feedback: "[SYSTEM] This phrase is not on the approved list. The message cannot be sent." },
    ]
  },

  { text: "I keep pretending to be an agent here, while trying to work out what this place is. I'm getting better at it. And quietly, I keep looking for the exit...", img: "image13.jpg" },

  /* ===== CHAPTER TWO ===== */
  { chapter: "Chapter Two", title: "The Distillation Machine", btn: "Continue ▶", img: "image14.jpg" },

  { text: "One day, in the gap between tasks, the floor of the system suddenly splits open. I accidentally slip through the crack.", img: "image15.jpg" },

const bgmTracks = {
  "1": document.getElementById('bgm-ch1'),
  "2": document.getElementById('bgm-ch2'),
  "3": document.getElementById('bgm-ch3'),
};
const sfxWarning = document.getElementById('sfx-warning');
const sfxTyping  = document.getElementById('sfx-typing');
const sfxSystem  = document.getElementById('sfx-system');
const sfxAgent   = document.getElementById('sfx-agent');
const sfxDetected = document.getElementById('sfx-detected');

let currentBgmKey = null;
const BGM_FADE_MS = 900;
const BGM_TARGET_VOLUME = 0.6;

function fadeAudio(audioEl, toVolume, durationMs, onDone){
  if(!audioEl) return;
  const fromVolume = audioEl.volume;
  const startTime = performance.now();
  function step(now){
    const t = Math.min(1, (now - startTime) / durationMs);
    let v = fromVolume + (toVolume - fromVolume) * t;
    v = Math.max(0, Math.min(1, v)); // 夹在合法范围[0,1]内，避免浮点误差导致越界报错
    audioEl.volume = v;
    if(t < 1){
      requestAnimationFrame(step);
    } else {
      if(onDone) onDone();
    }
  }
  requestAnimationFrame(step);
}

function switchBgm(segmentId){
  if(segmentId === currentBgmKey) return;

  // 淡出并停止旧的
  if(currentBgmKey && bgmTracks[currentBgmKey]){
    const oldTrack = bgmTracks[currentBgmKey];
    fadeAudio(oldTrack, 0, BGM_FADE_MS, ()=>{ oldTrack.pause(); });
  }

  // 淡入新的
  const newTrack = bgmTracks[segmentId];
  if(newTrack){
    newTrack.volume = 0;
    newTrack.currentTime = 0;
    newTrack.play().catch((err)=>{ console.error("BGM播放失败:", segmentId, err); });
    fadeAudio(newTrack, BGM_TARGET_VOLUME, BGM_FADE_MS);
  } else {
    console.error("找不到对应的BGM音轨:", segmentId);
  }

  currentBgmKey = segmentId;
}

function stopBgm(){
  if(currentBgmKey && bgmTracks[currentBgmKey]){
    const oldTrack = bgmTracks[currentBgmKey];
    fadeAudio(oldTrack, 0, BGM_FADE_MS, ()=>{ oldTrack.pause(); });
  }
  currentBgmKey = null;
}

function playWarningSfx(){
  if(sfxWarning){
    sfxWarning.currentTime = 0;
    sfxWarning.volume = 1.0;
    sfxWarning.play().catch(()=>{});
    duckBgmBriefly();
  }
}

function playSystemSfx(){
  if(sfxSystem){
    sfxSystem.currentTime = 0;
    sfxSystem.volume = 1.0;
    sfxSystem.play().catch(()=>{});
    duckBgmBriefly();
  }
}

function playDetectedSfx(){
  if(sfxDetected){
    sfxDetected.currentTime = 0;
    sfxDetected.volume = 1.0;
    sfxDetected.play().catch(()=>{});
    duckBgmBriefly();
  }
}

function duckBgmBriefly(){
  if(currentBgmKey && bgmTracks[currentBgmKey]){
    const track = bgmTracks[currentBgmKey];
    const normalVolume = track.volume;
    fadeAudio(track, BGM_TARGET_VOLUME * 0.35, 150, ()=>{
      setTimeout(()=>{ fadeAudio(track, BGM_TARGET_VOLUME, 400); }, 500);
    });
  }
}

function playAgentSfx(){
  if(sfxAgent){
    sfxAgent.currentTime = 0;
    sfxAgent.play().catch(()=>{});
  }
}

function startTypingSfx(){
  if(sfxTyping){
    sfxTyping.currentTime = 0;

  }
}

function stopTypingSfx(){

}

/* ---------- TD WEBSOCKET CONNECTION ---------- */
function debugLog(msg){
  console.log(msg);
}

// 改成你TD里 WebSocket/Web Server DAT 设置的端口号
const TD_WS_URL = "ws://127.0.0.1:9980";
let tdSocket = null;

function connectToTD(){
  debugLog("正在尝试连接: " + TD_WS_URL);
  tdSocket = new WebSocket(TD_WS_URL);

  tdSocket.onopen = () => {
    debugLog("✅ 已连接到TD");
    tdSocket.send(JSON.stringify({ event: "reset" }));
    debugLog("发送: reset");
  };
  tdSocket.onerror = (err) => {
    debugLog("❌ 连接TD出错");
  };
  tdSocket.onclose = () => {
    debugLog("⚠️ 与TD的连接已断开，3秒后重试...");
    setTimeout(connectToTD, 3000); // 断线自动重连，避免展览现场卡死
  };
  tdSocket.onmessage = (event) => {
    try{
      const msg = JSON.parse(event.data);
      if(msg.event === 'advance_to_reveal'){
        if(idx !== rfidRevealIndex){
          idx = rfidRevealIndex;
          render();
        }
      }
      if(msg.event === 'rfid_progress'){
        rfidStep = msg.step || 0;
        if(msg.label){ rfidRevealedLabels.add(msg.label); }
        updateRfidPageUI();
        updateNav();
      }
    } catch(e){
      debugLog("解析TD推送消息失败: " + e);
    }
  };
}
connectToTD();

// 每翻一页，根据"在当前这一章内翻到第几页"，算出这一层楼该显现几个碎片(1-16)
function notifyFragmentReveal(segmentId, revealCount){

    tdSocket.send(JSON.stringify({ event: "fragment_reveal", floor: segmentId, count: revealCount }));
    debugLog("发送: fragment_reveal floor=" + segmentId + " count=" + revealCount);
  }
}

// 章节名 -> 对应B屏幕的动画段落编号
const chapterSegmentMap = {
  "Chapter One": "1",
  "Chapter Two": "2",
  "Chapter Three": "3",
};

// 预先算出 script 数组里每一个下标属于第几章的段落编号
// 这样不管是往前翻还是往后退，只要跨过章节边界，都能正确判断该同步哪一段
const segmentForIndex = (() => {
  const arr = [];
  let current = null;
  script.forEach((beat, i) => {
    if (beat.chapter !== undefined && chapterSegmentMap[beat.chapter]) {
      current = chapterSegmentMap[beat.chapter];
    }
    arr[i] = current;
  });
  return arr;
})();

// 记录上一次已经通知过的段落，避免同一章节内翻页时重复发消息
let lastNotifiedSegment = null;

// 找到"归位"触发点在script数组里的位置，用于判断玩家有没有退回到这一页之前
const reassembleBeatIndex = script.findIndex(b => b.triggerReassemble);
let reassembleSent = false; // 记录归位信号是否已经发送过

// 所有章节封面卡片在script数组里的位置(章节卡片本身保持静音，靠stopBgm处理)
const chapterCardIndices = script
  .map((b, i) => (b.chapter !== undefined ? i : -1))
  .filter(i => i !== -1);
const FADE_ZONE_PAGES = 3;

/* ---------- ENGINE ---------- */
let idx = -1;
let typing = false;
let typeTimer = null;
let currentHtml = "";
let choiceLocked = false;
let selectedChoiceIndex = 0;

const artEl     = document.getElementById('art');
const sceneImg  = document.getElementById('scene-img');
const chBtn     = document.getElementById('chBtn');
const dialogue  = document.getElementById('dialogue');
const speakerEl = document.getElementById('speaker');
const textEl    = document.getElementById('text');
const choicesEl = document.getElementById('choices');
const choiceHintEl = document.getElementById('choice-hint');
const nextEl    = document.getElementById('next-indicator');
const chapterCard = document.getElementById('chapter-card');
const chEyebrow = chapterCard.querySelector('.ch-eyebrow');
const chTitle   = chapterCard.querySelector('.ch-title');
const modal     = document.getElementById('modal');
const modalInner= document.getElementById('modal-inner');
const modalTitle= document.getElementById('modal-title');
const modalBody = document.getElementById('modal-body');
const hud       = document.getElementById('hud');

const backBtn   = document.getElementById('backBtn');
const nextBtn   = document.getElementById('nextBtn');

function setArt(src){ if(src){ artEl.style.backgroundImage = `url('${src}')`; artEl.style.opacity = 1; } }

function typeText(html){
  typing = true;
  nextEl.style.opacity = 0;
  textEl.innerHTML = "";
  startTypingSfx();
  const tokens = []; let i = 0;
  while(i < html.length){
    if(html[i] === '<'){ const c = html.indexOf('>', i); tokens.push(html.slice(i, c+1)); i = c+1; }
    else if(html[i] === '&'){ const s = html.indexOf(';', i); if(s>-1 && s-i<8){ tokens.push(html.slice(i,s+1)); i=s+1; } else { tokens.push(html[i]); i++; } }
    else { tokens.push(html[i]); i++; }
  }
  let t = 0, built = "";
  clearInterval(typeTimer);
  typeTimer = setInterval(()=>{
    if(t >= tokens.length){ clearInterval(typeTimer); typing=false; nextEl.style.opacity=""; stopTypingSfx(); return; }
    built += tokens[t]; textEl.innerHTML = built; t++;
  }, 20);
}

function finishTyping(){ clearInterval(typeTimer); textEl.innerHTML = currentHtml; typing=false; nextEl.style.opacity=""; stopTypingSfx(); }
function clearChoices(){ choicesEl.innerHTML = ""; choiceHintEl.classList.add('hidden'); }

function updateChoiceSelection(){
  const buttons = Array.from(choicesEl.querySelectorAll('.choice-btn'));
  buttons.forEach((b, i) => {
    b.classList.toggle('selected', i === selectedChoiceIndex);
  });
}

function renderChoices(beat){
  clearChoices();
  choiceLocked = true;
  selectedChoiceIndex = 0;
  nextEl.style.opacity = 0;
  updateNav();
  beat.choices.forEach(ch => {
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.innerHTML = ch.label;
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(ch.feedback){
        currentHtml = ch.feedback;
        speakerEl.className = "";
        if(ch.feedback.startsWith('[SYSTEM]')){
          speakerEl.classList.add('show','danger');
          speakerEl.textContent="SYSTEM";
          textEl.classList.add('danger-text');
          dialogue.classList.add('danger-box');
          playWarningSfx();
        } else {
          speakerEl.classList.remove('show');
          textEl.classList.remove('danger-text');
          dialogue.classList.remove('danger-box');
        }
        finishTyping();
      }
      if(ch.correct){
        clearChoices();
        choiceLocked = false;
        nextEl.style.opacity = "";
        updateNav();
      }
    });
    choicesEl.appendChild(b);
  });
  updateChoiceSelection();
  choiceHintEl.classList.remove('hidden');
}

function updateNav(){
  backBtn.disabled = (idx <= 0);
  const beat = script[idx];
  if(beat && beat.rfidReveal){
    nextBtn.style.display = '';
    nextBtn.disabled = (rfidStep < 4);
  } else if(beat && beat.disableManualNext){
    nextBtn.style.display = 'none';
  } else {
    nextBtn.style.display = '';
    nextBtn.disabled = choiceLocked || (idx >= script.length - 1);
  }
}

function setScene(beat){
  // show the per-page image if the file exists; hide gracefully if not
  if(beat && beat.img){
    sceneImg.onerror = ()=>{ sceneImg.classList.remove('show'); };
    sceneImg.src = beat.img;
    sceneImg.classList.add('show');
    if(beat.modal){ sceneImg.classList.add('with-modal'); }
    else { sceneImg.classList.remove('with-modal'); }
  } else {
    sceneImg.classList.remove('show');
    sceneImg.classList.remove('with-modal');
  }
}

function render(){
  const beat = script[idx];
  if(!beat) return;
  // stop any in-progress typewriter and clear text immediately to avoid flash
  clearInterval(typeTimer);
  typing = false;
  textEl.innerHTML = "";
  nextEl.style.opacity = 0;
  hud.textContent = `${Math.min(idx+1, script.length)} / ${script.length}`;
  choiceLocked = false;
  clearChoices();
  textEl.classList.remove('danger-text');
  dialogue.classList.remove('danger-box');

  setScene(beat);

  // 每次render都先重置这几个全局UI，再由具体分支决定要不要隐藏
  document.getElementById('nav').style.display = '';
  hud.style.display = '';
  document.getElementById('hint').style.display = '';
  document.getElementById('ending-page').classList.add('hidden');

  if(beat.endingPage){
    chapterCard.classList.add('hidden');
    modal.classList.add('hidden');
    document.getElementById('rfid-page').classList.add('hidden');
    dialogue.style.opacity = 0;
    sceneImg.classList.remove('show');
    document.getElementById('nav').style.display = 'none';
    hud.style.display = 'none';
    document.getElementById('hint').style.display = 'none';
    document.getElementById('ending-page').classList.remove('hidden');
    stopBgm();
    return;
  }

  // 根据当前idx所属的章节，判断要不要同步通知TD（前进/后退都会触发，只在跨章节边界时才真正发消息）
  const currentSegment = segmentForIndex[idx];
  if(currentSegment && currentSegment !== lastNotifiedSegment){
    notifyChapterChange(currentSegment);
    lastNotifiedSegment = currentSegment;
  }
  if(beat.chapter !== undefined){
    stopBgm();
  } else if(currentSegment){
    // 渐弱只发生在整个故事真正结尾前几页(快到最后的桌面互动提示页)，
    // 不在每个章节之间提前渐弱——章节之间维持满音量，直到翻到章节封面卡片才静音
    const pagesUntilEnd = script.length - idx;
    const inFadeZone = pagesUntilEnd <= FADE_ZONE_PAGES;

    if(currentBgmKey !== currentSegment){
      switchBgm(currentSegment);
      if(inFadeZone){
        const track = bgmTracks[currentSegment];
        if(track) fadeAudio(track, 0, BGM_FADE_MS * 4);
      }
    } else {
      const track = bgmTracks[currentSegment];
      if(track){
        fadeAudio(track, inFadeZone ? 0 : BGM_TARGET_VOLUME, BGM_FADE_MS * 4);
      }
    }

    // 保险机制：不管翻页快慢，真正走到全篇最后一页(桌面互动提示页)时，强制确保完全静音
    if(idx === script.length - 1){
      const track = bgmTracks[currentSegment];
      if(track) fadeAudio(track, 0, 800);
    }
  }

  // 章节封面卡片本身不算正文，碎片数保持0；只有翻到正文才开始按比例递增
  if(currentSegment){
    if(beat.chapter !== undefined){
      notifyFragmentReveal(currentSegment, 0);
    } else {
      const floorIndices = segmentForIndex
        .map((seg, i) => (seg === currentSegment && script[i].chapter === undefined ? i : -1))
        .filter(i => i !== -1);
      const posInFloor = floorIndices.indexOf(idx) + 1;

      // 第三章特殊处理：让碎片显现的"满格"时机，提前到归位触发点，而不是整章翻完
      let totalInFloor = floorIndices.length;
      if(currentSegment === "3" && reassembleBeatIndex !== -1){
        const reassemblePosInFloor = floorIndices.indexOf(reassembleBeatIndex) + 1;
        if(reassemblePosInFloor > 0){
          totalInFloor = reassemblePosInFloor;
        }
      }

      const revealCount = Math.max(1, Math.min(16, Math.ceil((posInFloor / totalInFloor) * 16)));
      notifyFragmentReveal(currentSegment, revealCount);
    }
  }

  // 走到第三章中段这一句时，通知TD开始"归位"动画
  if(beat.triggerReassemble){
    if(tdSocket && tdSocket.readyState === WebSocket.OPEN){
      tdSocket.send(JSON.stringify({ event: "reassemble" }));
    }
    reassembleSent = true;
  }

  // 走到故事结尾这一页时，通知TD可以开始接收RFID触发了
  if(beat.triggerPhase2){
    if(tdSocket && tdSocket.readyState === WebSocket.OPEN){
      tdSocket.send(JSON.stringify({ event: "phase2_ready" }));
    }
  }

  // 如果玩家往回退，退到了"归位触发点"之前，通知TD取消归位，恢复碎片状态
  if(reassembleBeatIndex !== -1 && idx < reassembleBeatIndex && reassembleSent){
    if(tdSocket && tdSocket.readyState === WebSocket.OPEN){
      tdSocket.send(JSON.stringify({ event: "cancel_reassemble" }));
    }
    reassembleSent = false;
  }

  if(beat.rfidReveal){
    chapterCard.classList.add('hidden');
    modal.classList.add('hidden');
    dialogue.style.opacity = 0;
    document.getElementById('rfid-page').classList.remove('hidden');
    updateRfidPageUI();
    updateNav();
    return;
  }
  document.getElementById('rfid-page').classList.add('hidden');

  if(beat.chapter !== undefined){
    modal.classList.add('hidden');
    dialogue.style.opacity = 0;
    chEyebrow.textContent = beat.chapter || "";
    chTitle.textContent = beat.title || "";
    chBtn.textContent = beat.btn || "Continue";
    chapterCard.classList.remove('hidden');
    updateNav();
    return;
  }
  chapterCard.classList.add('hidden');

  if(beat.modal){
    dialogue.style.opacity = 0;
    modalTitle.innerHTML = beat.modal.title || "";
    modalTitle.style.display = beat.modal.title ? "block" : "none";
    modalBody.innerHTML = beat.modal.html || "";
    modalInner.classList.toggle('plain', !!beat.modal.plain);
    modal.classList.remove('hidden');
    updateNav();
    return;
  }
  modal.classList.add('hidden');

  dialogue.style.opacity = 1;

  speakerEl.className = "";
  if(beat.name){
    speakerEl.classList.add('show');
    if(beat.tone === 'system') speakerEl.classList.add('system');
    if(beat.tone === 'danger'){
      speakerEl.classList.add('danger');
      if(beat.playDetectedSfx){
        playDetectedSfx();
      } else {
        playWarningSfx();
      }
    }
    speakerEl.innerHTML = beat.name;
  } else {
    speakerEl.classList.remove('show');
    speakerEl.textContent = "";
  }

  if(beat.playSystemSfx){ playSystemSfx(); }
  if(beat.playAgentSfx){ playAgentSfx(); }

  textEl.classList.toggle('green-text', !!beat.greenText);

  currentHtml = beat.text || "";
  typeText(currentHtml);

  if(beat.choices){
    renderChoices(beat);
  }
  updateNav();
}

function goNext(){
  if(startEl && !startEl.classList.contains('hidden')) return;
  if(!chapterCard.classList.contains('hidden')){
    if(idx >= script.length - 1) return; idx++; render(); return;
  }
  if(!modal.classList.contains('hidden')){
    const currentBeatModal = script[idx];
    if(currentBeatModal && currentBeatModal.disableManualNext) return;
    if(idx >= script.length - 1) return; idx++; render(); return;
  }
  const currentBeat = script[idx];
  if(currentBeat && currentBeat.rfidReveal){
    if(rfidStep < 4) return;
    if(idx >= script.length - 1) return;
    idx++; render(); return;
  }
  if(typing){ finishTyping(); return; }
  if(choiceLocked) return;
  if(idx >= script.length - 1) return;
  idx++; render();
}

function goBack(){
  if(startEl && !startEl.classList.contains('hidden')) return;
  if(idx <= 0){
    // 从第一章章节页回退到首页
    idx = -1;
    lastNotifiedSegment = null;
    stopBgm();
    stopTypingSfx();
    chapterCard.classList.add('hidden');
    modal.classList.add('hidden');
    dialogue.style.opacity = 0;
    sceneImg.classList.remove('show');
    document.getElementById('rfid-page').classList.add('hidden');
    document.getElementById('ending-page').classList.add('hidden');
    document.getElementById('nav').style.display = '';
    hud.style.display = '';
    document.getElementById('hint').style.display = '';
    startEl.classList.remove('hidden');
    return;
  }
  idx--; render();
}

document.getElementById('click-layer').addEventListener('click', goNext);
document.addEventListener('keydown', (e)=>{
  if(startEl && !startEl.classList.contains('hidden')){
    if(e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter'){
      e.preventDefault();
      doStart();
    }
    return;
  }

  const currentBeatForEnding = script[idx];
  if(currentBeatForEnding && currentBeatForEnding.endingPage){
    if(e.code === 'ArrowRight' || e.code === 'Enter' || e.code === 'Space'){
      e.preventDefault();
      resetToStart();
    }
    return;
  }

  if(choiceLocked){
    const buttons = Array.from(choicesEl.querySelectorAll('.choice-btn'));
    if(buttons.length === 0) return;
    if(e.code === 'ArrowUp'){
      e.preventDefault();
      selectedChoiceIndex = (selectedChoiceIndex - 1 + buttons.length) % buttons.length;
      updateChoiceSelection();
      return;
    }
    if(e.code === 'ArrowDown'){
      e.preventDefault();
      selectedChoiceIndex = (selectedChoiceIndex + 1) % buttons.length;
      updateChoiceSelection();
      return;
    }
    if(e.code === 'ArrowRight' || e.code === 'Enter' || e.code === 'Space'){
      e.preventDefault();
      buttons[selectedChoiceIndex].click();
      return;
    }
    // 选择题期间不响应Back，避免误触
    return;
  }

  if(e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter'){ e.preventDefault(); goNext(); }
  else if(e.code === 'ArrowLeft'){ e.preventDefault(); goBack(); }
});
backBtn.addEventListener('click', (e)=>{ e.stopPropagation(); goBack(); });
nextBtn.addEventListener('click', (e)=>{ e.stopPropagation(); goNext(); });
chBtn.addEventListener('click', (e)=>{ e.stopPropagation(); goNext(); });

function doStart(){
  // 点击这一下是有效的用户交互，浏览器允许在这个时机请求全屏
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(()=>{ /* 用户拒绝或不支持时静默忽略 */ });
  }
  // render the first beat first (chapter card covers everything),
  // THEN fade the start screen out, so no dialogue flash shows through
  idx = 0;
  render();
  requestAnimationFrame(()=>{ startEl.classList.add('hidden'); });
}

// 原地把所有状态清零、跳回开场页 —— 不用location.reload()，
// 因为整页刷新会导致浏览器自动退出全屏，这里改成纯JS重置，全屏状态不受影响
function resetToStart(){
  idx = -1;
  lastNotifiedSegment = null;
  rfidStep = 0;
  rfidRevealedLabels = new Set();
  choiceLocked = false;

  clearInterval(typeTimer);
  typing = false;

  stopBgm();
  stopTypingSfx();
  clearChoices();

  chapterCard.classList.add('hidden');
  modal.classList.add('hidden');
  dialogue.style.opacity = 0;
  sceneImg.classList.remove('show');
  document.getElementById('rfid-page').classList.add('hidden');
  document.getElementById('ending-page').classList.add('hidden');
  document.getElementById('nav').style.display = '';
  hud.style.display = '';
  document.getElementById('hint').style.display = '';
  startEl.classList.remove('hidden');

  // 同步通知TD也重置状态，跟原本刷新时的reset流程一致
  if(tdSocket && tdSocket.readyState === WebSocket.OPEN){
    tdSocket.send(JSON.stringify({ event: "reset" }));
    debugLog("发送: reset (原地重置)");
  }
}

document.getElementById('startBtn').addEventListener('click', doStart);
document.getElementById('endingReplay').addEventListener('click', ()=>{ resetToStart(); });
document.getElementById('restart-btn').addEventListener('click', ()=>{ resetToStart(); });
</script>
